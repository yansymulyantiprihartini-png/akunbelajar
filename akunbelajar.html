<!DOCTYPE html>
<html>
<head>
    <title>Registrasi Akun Belajar</title>
    <style>
        body{
            background-color: #eef2ff;
            font-family: Arial;
        }
        .form{
            background: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 5px;
        }
        h3{
            text-align: center;
            margin-bottom: 5px;
        }
        small{
            display: block;
            text-align: center;
            color: gray;
            margin-bottom: 20px;
            font-size: 11px;
        }
        label{
            font-size: 12px;
            font-weight: bold;
        }
        input, select{
            width: 100%;
            padding: 7px;
            margin: 5px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button{
            width: 100%;
            background-color: #2f66ff;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="form">
        <h3>Registrasi Akun Belajar</h3>
        <small>Lengkapi formulir di bawah ini dengan benar</small>
        
        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama lengkap">
        
        <label>Alamat Email</label>
        <input type="email" placeholder="nama@contoh.com">
        
        <label>Kata Sandi</label>
        <input type="password" placeholder="Minimal 8 karakter">
        
        <label>Konfirmasi Kata Sandi</label>
        <input type="password" placeholder="Ulangi kata sandi">
        
        <label>Status Pengguna</label>
        <select>
            <option>Pilih status</option>
            <option>Pelajar</option>
            <option>Guru</option>
        </select>
        
        <button>Daftar</button>
    </div>
</body>
  </html>
